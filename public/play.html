<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161b25">
<title>DM Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
/* If the page's scripts can't start (a missing or out-of-date file after an update), say so instead of showing a blank screen. */
(function () {
  var shown = false;
  function show(detail) {
    if (shown || window.__started) return;
    shown = true;
    var d = document.createElement("div");
    d.className = "bootbanner";
    d.setAttribute("role", "alert");
    d.innerHTML = "<b>This page couldn't start.</b> A file may be missing or out of date after an update. Upload the complete set of project files, then refresh with Ctrl+Shift+R (Cmd+Shift+R on a Mac).<br><small></small>";
    d.querySelector("small").textContent = "Detail: " + detail;
    (document.body || document.documentElement).insertBefore(d, (document.body || document.documentElement).firstChild);
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName) { if (t.tagName === "SCRIPT") show("could not load " + String(t.src || "").split("/").pop()); return; }
    show(e.message || "unknown error");
  }, true);
  window.addEventListener("unhandledrejection", function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () { show("the page did not finish starting"); }, 15000);
})();
</script>
</head>
<body>
<div class="pview">
  <header class="ptop">
    <div class="who"><span class="code" id="pcode"></span><span class="conn" id="conn" title="Connection"></span>
      <button class="btn small" id="whoBtn" type="button">Log in</button></div>
    <div class="banner" id="banner" role="status"></div>
  </header>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="mapfloat" id="mapFloat" hidden>
      <div class="mapbtns">
        <button class="btn" id="pingBtn" type="button" aria-pressed="false">Ping</button>
        <button class="btn" id="moveBtn" type="button" aria-pressed="false" hidden>Move</button>
      </div>
      <div class="mapmsg" id="mapMsg" role="status"></div>
      <div class="mapmsg" id="moveReason"></div>
      <div class="movebar" id="moveBar" hidden>
        <span>Move here?</span>
        <button class="btn small primary" id="moveSend" type="button">Send to DM</button>
        <button class="btn small" id="moveCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>
  <section class="sheet" id="sheet" hidden aria-live="polite">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="btn small" id="sheetClose" type="button">Close</button></div>
    <div id="sheetBody"></div>
    <div id="campBody" hidden></div>
    <div id="charBody" hidden></div>
    <div id="spellBody" hidden></div>
    <div id="noteBody" hidden></div>
    <div id="diceBody" hidden>
      <div id="roller"></div>
      <div class="feedbox" id="feedWrap" hidden>
        <h3>Table rolls</h3>
        <ol class="feed" id="feedList"></ol>
      </div>
    </div>
  </section>
  <nav class="dock" id="dock" aria-label="Panels">
    <button class="btn" data-sheet="init" type="button">Initiative</button>
    <button class="btn" data-sheet="goals" type="button">Goals</button>
    <button class="btn" data-sheet="camp" type="button">Campaign</button>
    <button class="btn" data-sheet="inv" type="button">Items</button>
    <button class="btn" data-sheet="char" type="button">Sheet</button>
    <button class="btn" data-sheet="spells" type="button">Spells</button>
    <button class="btn" data-sheet="notes" type="button">Notes</button>
    <button class="btn" data-sheet="dice" type="button">Dice</button>
    <button class="btn" id="fitBtn" type="button">Fit map</button>
  </nav>
</div>
<dialog id="loginDlg"></dialog>
<script type="module" src="play.js"></script>
</body>
</html>
